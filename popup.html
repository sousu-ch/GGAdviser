<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>GGAdviser Popup</title>
    <style>
      body {
        width: 280px;
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        padding: 16px;
        margin: 0;
        background: #f9fafb;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .logo {
        font-size: 1.25rem;
        font-weight: 800;
        background: linear-gradient(to right, #4f46e5, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status-card {
        background: white;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid #e5e7eb;
        margin-bottom: 16px;
      }
      .label {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.025em;
      }
      .value {
        font-size: 0.9rem;
        font-weight: 600;
        color: #111827;
        word-break: break-all;
      }
      .btn-open-settings {
        display: block;
        width: 100%;
        padding: 10px;
        background: #4f46e5;
        color: white;
        text-align: center;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        transition: background 0.2s;
        border: none;
        cursor: pointer;
      }
      .btn-open-settings:hover {
        background: #4338ca;
      }
      .footer {
        margin-top: 12px;
        text-align: center;
        font-size: 0.7rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="logo">GGAdviser</span>
      <small id="app-version" style="font-size: 0.75rem; color: #9ca3af; font-weight: 500; margin-left: auto;"></small>
    </div>

    <!-- Permission Status Section -->
    <div class="status-card" id="permission-card" style="border-left: 4px solid #9ca3af;">
      <div class="label">権限ステータス</div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="perm-status-text" class="value">確認中...</span>
        <button id="btn-request-perm" style="display: none; padding: 4px 8px; font-size: 0.75rem; background: #4f46e5; color: white; border: none; border-radius: 4px; cursor: pointer;">設定を開く</button>
      </div>
    </div>

    <div class="status-card">
      <div class="label">アクティブなマップ</div>
      <select id="map-select" class="url-input" style="cursor: pointer;">
        <option value="" disabled selected>読み込み中...</option>
      </select>
      <div id="map-select-status" style="font-size: 0.75rem; color: #059669; text-align: right; height: 1rem; margin-top: 4px;"></div>
    </div>

    <div class="status-card">
      <div class="label">解析プロンプト</div>
      <select id="prompt-select" class="url-input" style="cursor: pointer;">
        <option value="" disabled selected>読み込み中...</option>
      </select>
      <div id="prompt-select-status" style="font-size: 0.75rem; color: #059669; text-align: right; height: 1rem; margin-top: 4px;"></div>
    </div>

    <button id="open-options" class="btn-open-settings">詳細設定を開く</button>



    <script src="content_scripts/utils/constants.js"></script>
    <script src="content_scripts/utils/prompts.js"></script>
    <script src="popup.js"></script>
  </body>
  <style>
    /* Additional Styles */
    .url-input {
      width: 100%;
      padding: 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 0.85rem;
      box-sizing: border-box;
      margin-bottom: 8px;
      font-family: monospace;
    }
    .url-input:focus {
      outline: none;
      border-color: #4f46e5;
      box-shadow: 0 0 0 2px rgba(79, 70, 229, 0.1);
    }
    .btn-save {
      width: 100%;
      padding: 6px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-save:hover {
      background: #4338ca;
    }
  </style>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>GGAdviser Popup</title>
    <style>
      body {
        width: 280px;
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        padding: 16px;
        margin: 0;
        background: #f9fafb;
      }
      .header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 20px;
      }
      .logo {
        font-size: 1.25rem;
        font-weight: 800;
        background: linear-gradient(to right, #4f46e5, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status-card {
        background: white;
        border-radius: 8px;
        padding: 12px;
        border: 1px solid #e5e7eb;
        margin-bottom: 16px;
      }
      .label {
        font-size: 0.75rem;
        color: #6b7280;
        margin-bottom: 4px;
        text-transform: uppercase;
        letter-spacing: 0.025em;
      }
      .value {
        font-size: 0.9rem;
        font-weight: 600;
        color: #111827;
        word-break: break-all;
      }
      .btn-open-settings {
        display: block;
        width: 100%;
        padding: 10px;
        background: #4f46e5;
        color: white;
        text-align: center;
        border-radius: 6px;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        transition: background 0.2s;
        border: none;
        cursor: pointer;
      }
      .btn-open-settings:hover {
        background: #4338ca;
      }
      .footer {
        margin-top: 12px;
        text-align: center;
        font-size: 0.7rem;
        color: #9ca3af;
      }
    </style>
  </head>
  <body>
    <div class="header">
      <span class="logo">GGAdviser</span>
    </div>

    <div class="status-card">
      <div class="label">現在のマップ設定</div>
      <div id="map-url-status" class="value">読み込み中...</div>
    </div>

    <button id="open-options" class="btn-open-settings">詳細設定を開く</button>

    <div class="footer">GeoGuessr Breakdown Helper</div>

    <script src="popup.js"></script>
  </body>
</html>
